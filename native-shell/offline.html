<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HYBRIDX.CLUB</title>
  <style>
    :root { --bg: #ffffff; --fg: #111111; --muted: #666666; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0b; --fg: #f5f5f5; --muted: #a3a3a3; } }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      box-sizing: border-box;
    }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 20px 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
    button {
      font: inherit; font-weight: 600; padding: 12px 28px; border-radius: 999px;
      border: 0; background: var(--fg); color: var(--bg);
    }
  </style>
</head>
<body>
  <main>
    <img src="icon-logo.png" alt="">
    <h1>You're offline</h1>
    <p>HYBRIDX needs an internet connection.<br>Check your connection and try again.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    var APP_URL = 'https://app.hybridx.club/';
    function retry() { location.replace(APP_URL); }
    document.getElementById('retry').addEventListener('click', retry);
    // Come back on our own once the connection returns.
    window.addEventListener('online', retry);
  </script>
</body>
</html>
